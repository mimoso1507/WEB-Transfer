plugins { id 'com.android.application' }

android {
    namespace 'com.transfer.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.transfer.app'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
