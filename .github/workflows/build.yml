name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - run: gradle assembleRelease --no-daemon
      - run: |
          cp app/build/outputs/apk/release/*.apk Transfer.apk
          cp browser/build/outputs/apk/release/*.apk Navegador-Archivos-v2.apk
      - uses: actions/upload-artifact@v4
        with: { name: apks, path: '*.apk' }
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Transfer y Navegador (última versión)
          body: "Transfer.apk (servidor) y Navegador-Archivos-v2.apk (navegador y archivos para apps locales), compilados automáticamente desde ${{ github.sha }}."
          files: |
            Transfer.apk
            Navegador-Archivos-v2.apk
          make_latest: true
