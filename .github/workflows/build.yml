name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/navegador.jks
          else
            echo "Sin llave fija: se firma con la llave de prueba"
          fi
      - run: gradle assembleRelease --no-daemon
      - run: |
          cp app/build/outputs/apk/release/*.apk Transfer.apk
          cp browser/build/outputs/apk/release/*.apk Navegador-Transfer.apk
      - uses: actions/upload-artifact@v4
        with: { name: apks, path: '*.apk' }
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Transfer y Navegador (última versión)
          body: "Transfer.apk (servidor) y Navegador-Transfer.apk (navegador, archivos y Transfer en una sola app), compilados automáticamente desde ${{ github.sha }}."
          files: |
            Transfer.apk
            Navegador-Transfer.apk
          make_latest: true
