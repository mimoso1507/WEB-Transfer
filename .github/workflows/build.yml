name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/*.apk Transfer.apk
      - uses: actions/upload-artifact@v4
        with: { name: Transfer-apk, path: Transfer.apk }
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Transfer (última versión)
          body: "APK compilado automáticamente desde ${{ github.sha }}."
          files: Transfer.apk
          make_latest: true
