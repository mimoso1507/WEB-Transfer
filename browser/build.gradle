plugins { id 'com.android.application' }

android {
    namespace 'com.transfer.navegador'
    compileSdk 35

    // Llave fija (la pone el flujo de GitHub desde un secreto): asi cada version se instala encima de la anterior.
    // Si no existe, se firma con la llave de prueba y hay que desinstalar antes de actualizar.
    def keystore = rootProject.file('keystore/navegador.jks')
    signingConfigs {
        if (keystore.exists()) {
            release {
                storeFile keystore
                storePassword 'navegador'
                keyAlias 'navegador'
                keyPassword 'navegador'
            }
        }
    }
    defaultConfig {
        applicationId 'com.transfer.navegador'
        minSdk 21
        targetSdk 35
        versionCode 100 + (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
        versionName "3.${(System.getenv('GITHUB_RUN_NUMBER') ?: '0')}"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    def media3 = '1.8.0'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-exoplayer-smoothstreaming:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    // Decodificadores de audio extra (AC3, E-AC3, DTS, TrueHD, Opus, Vorbis, FLAC, ...)
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:${media3}+1"
}
